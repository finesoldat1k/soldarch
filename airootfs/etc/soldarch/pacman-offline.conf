# /etc/soldarch/pacman-offline.conf — только локальный репозиторий внутри ISO
[options]
HoldPkg     = pacman glibc
Architecture = auto
SigLevel    = Optional TrustAll
LocalFileSigLevel = Optional
ParallelDownloads = 5
CheckSpace

[soldarch]
SigLevel = Optional TrustAll
Server = file:///opt/soldarch/repo
